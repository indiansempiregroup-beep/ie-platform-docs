site_name: IE Platform Documentation
site_description: Single source of truth for the IE Platform product, architecture, engineering, and operations.
site_author: IE Platform Team
repo_url: https://github.com/example/ie-platform-docs
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Governance: 00-governance/README.md
  - Platform: 01-platform/README.md
  - Architecture: 02-architecture/README.md
  - Database: 03-database/README.md
  - API: 04-api/README.md
  - Design: 05-design/README.md
  - Products: 06-products/README.md
    - AppointIE: 06-products/AppointIE/README.md
  - Development: 07-development/README.md
  - Security: 08-security/README.md
  - DevOps: 09-devops/README.md
  - Testing: 10-testing/README.md
  - AI: 11-ai/README.md
  - White Label: 12-white-label/README.md
  - Integrations: 13-integrations/README.md
  - Roadmap: 14-roadmap/README.md
  - Decisions: 15-decisions/README.md
  - Appendices: appendices/README.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: Roboto Mono

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/example/ie-platform-docs
